# Thinkpad shell surfaces, Vantablack edition. Based on Omarchy's shell.toml.tpl
# with literal values from colors.toml. Every surface is pure black; red is
# reserved for focus, selection, and errors, and every other border is graphite.

[bar]
background       = "#000000"
background-alpha = 1.0
text             = "#FFFFFF"
# Modules calling attention to themselves (recording, voxtype, alerts, updates)
active           = "#E3241A"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28

[hyprland]
active-border            = "#E3241A"
active-border-foreground = "#FFFFFF"

[controls]
normal-color        = "#FFFFFF"
normal-fill-alpha   = 0.04
normal-border       = "#FFFFFF"
normal-border-width = 1
normal-border-alpha = 0.4

hover-cursor-color        = "#FFFFFF"
hover-cursor-fill-alpha   = 0.08
hover-cursor-border       = "#FFFFFF"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.25

focus-color        = "#FFFFFF"
focus-fill-alpha   = 0.08
focus-border       = "#FFFFFF"
focus-border-width = 1
focus-border-alpha = 0.25

selected-color        = "#FFFFFF"
selected-fill-alpha   = 0.18
selected-border       = "#FFFFFF"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background       = "#000000"
background-alpha = 1.0
text             = "#FFFFFF"
border           = "#333333"
border-alpha     = 1.0
border-width     = 1

[tooltip]
background       = "#000000"
background-alpha = 0.97
text             = "#FFFFFF"
border           = "#333333"
border-alpha     = 1.0

[notifications]
background       = "#000000"
background-alpha = 1.0
text             = "#FFFFFF"
border           = "#333333"
border-alpha     = 1.0
countdown        = "#E3241A"

[launcher]
background                = "#000000"
background-alpha          = 0.95
text                      = "#FFFFFF"
border                    = "#333333"
border-alpha              = 1.0
scrim                     = "#000000"
scrim-alpha               = 0.5
selected-background       = "#FFFFFF"
selected-background-alpha = 0.08
selected-text             = "#E3241A"
selected-border           = "#FFFFFF"
selected-border-alpha     = 0.25

[menu]
background                = "#000000"
background-alpha          = 1.0
text                      = "#FFFFFF"
border                    = "#333333"
border-alpha              = 1.0
scrim                     = "#000000"
scrim-alpha               = 0.5
selected-background       = "#FFFFFF"
selected-background-alpha = 0.08
selected-text             = "#E3241A"
selected-border           = "#FFFFFF"
selected-border-alpha     = 0.25

[polkit]
background       = "#000000"
background-alpha = 1.0
text             = "#FFFFFF"
text-error       = "#FF5A4F"
border           = "#333333"
border-error     = "#E3241A"
border-alpha     = 1.0
scrim            = "#000000"
scrim-alpha      = 0.5
accent           = "#E3241A"

[lock]
background       = "#000000"
background-alpha = 0.8
text             = "#FFFFFF"
placeholder      = "#7A7A7A"
text-error       = "#FF5A4F"
border           = "#333333"
border-active    = "#E3241A"
border-error     = "#E3241A"
border-alpha     = 1.0
selection        = "#E3241A"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#000000"
scrim-alpha             = 0.5
text                    = "#FFFFFF"
selected-border         = "#E3241A"
selected-border-alpha   = 1.0
unselected-border       = "#FFFFFF"
unselected-border-alpha = 0.28
